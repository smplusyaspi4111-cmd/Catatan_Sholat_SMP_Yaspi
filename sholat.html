<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Sholat Fiqih | SMP Yaspi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --primary: #0b6623; 
            --secondary: #d4af37; 
            --light: #f4f6f9; 
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--light); 
            user-select: none; 
        }
        .header-sholat { 
            background: linear-gradient(135deg, var(--primary) 0%, #053b11 100%); 
            color: white; 
            padding: 25px 20px; 
            border-bottom-left-radius: 25px; 
            border-bottom-right-radius: 25px; 
        }
        .jam-aktif {
            background-color: #1a5276;
            color: white;
            font-weight: 700;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            display: inline-block;
        }
        .sholat-card { 
            background: white; 
            border-radius: 15px; 
            border: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        .sholat-row {
            display: flex;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            gap: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .sholat-indeks {
            background-color: #4a7ebb;
            color: white;
            padding: 15px;
            border-radius: 10px;
            min-width: 150px;
            text-align: center;
            font-weight: 600;
            position: relative;
        }
        .sholat-indeks::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 10px solid #4a7ebb;
        }
        .kotak-jam-masuk {
            background-color: #f39c12;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 4px;
            font-weight: bold;
            border: 2px solid #e67e22;
        }
        
        .btn-opsi-sholat {
            flex: 1;
            min-width: 140px;
            height: 85px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            padding: 5px;
            text-align: center;
        }
        .btn-opsi-sholat:disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .btn-biru { background-color: #2980b9; }      
        .btn-abu { background-color: #7f8c8d; }       
        .btn-hijau { background-color: #27ae60; }     
        .btn-kuning { background-color: #f1c40f; color: #2c3e50 !important; }    
        .btn-merah { background-color: #e74c3c; }      
        
        .btn-opsi-sholat span {
            font-size: 0.7rem;
            font-weight: normal;
            opacity: 0.9;
            display: block;
            margin-top: 2px;
        }
        .text-sub-tombol {
            font-size: 0.75rem !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>

    <div class="header-sholat shadow-sm">
        <div class="container d-flex justify-content-between align-items-center flex-wrap g-2">
            <div>
                <a href="index.html" class="text-white text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Portal</a>
                <h4 class="fw-bold mt-2 mb-1">📋 CATATAN SHOLAT SMP YASPI MEDAN</h4>
                <div class="d-flex align-items-center gap-3 mt-2 flex-wrap">
                    <span class="text-white" id="tglHariIni">Jum'at, 19 Juni 2026</span>
                    <div class="jam-aktif" id="jamDigital">00:00:00</div>
                </div>
                <div class="fw-bold text-warning small mt-1">KOTA MEDAN AUTOMATIC</div>
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="card sholat-card p-4 mb-4">
            <h5 class="fw-bold mb-3 text-muted text-uppercase" style="font-size: 0.9rem; letter-spacing: 1px;">VERIFIKASI AKSES & PASSWORD</h5>
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">MASUKKAN NIM (NOMOR INDUK MURID)</label>
                    <input type="number" class="form-control" id="nimSiswa" placeholder="Ketik NIM..." oninput="verifikasiNIM()">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">E-PASSWORD KAMU</label>
                    <input type="password" class="form-control" id="passSiswa" placeholder="Ketik Password..." disabled oninput="cekPasswordKetik()">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100 fw-bold text-uppercase" id="btnSimpanPw" disabled onclick="simpanPasswordBaru()">SIMPAN</button>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">STATUS VERIFIKASI</label>
                    <div id="statusProfil" class="alert alert-secondary mb-0 p-2 d-flex align-items-center fw-bold small" style="min-height: 38px;">
                        Silakan masukkan NIM terlebih dahulu.
                    </div>
                </div>
            </div>
        </div>

        <div id="wadahAbsenSholat" style="display: none;">
            </div>
    </div>

    <script>
        // URL WEB APP TERBARU SUDAH SAYA MASUKKAN KE SINI
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbyGC6vfUe-b5_XvmZoXauQ0iMwb_g7xa3G2voFheGqHyRyz28clL3WyELFM6WZ81Zgu/exec"; 
        
        let jadwalMedan = { "S": "05:01", "Z": "12:28", "A": "15:55", "M": "18:37", "I": "19:52", "S_Besok": "05:02" };
        let profilSiswa = null; 

        function ClinicalTime(dateObj) {
            return dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).replace(/\./g, ':');
        }

        function _toMenit(j) { const [h, m] = j.split(':').map(Number); return h * 60 + m; }
        function _toJamStr(mTotal) { 
            let mAsli = mTotal % 1440; 
            return `${String(Math.floor(mAsli / 60)).padStart(2,'0')}:${String(mAsli % 60).padStart(2,'0')}`; 
        }

        document.getElementById('tglHariIni').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        
        setInterval(() => {
            const sekarang = new Date();
            document.getElementById('jamDigital').innerText = ClinicalTime(sekarang);
        }, 1000);

        // Ambil Jadwal dari Server
        fetch(URL_WEB_APP, { method: "POST", body: JSON.stringify({ action: "ambil_jadwal" }) })
        .then(r => r.json()).then(res => {
            if(res.status === "sukses") {
                const j = res.jadwal;
                jadwalMedan["S"] = j.subuh; jadwalMedan["Z"] = j.dzuhur; jadwalMedan["A"] = j.ashar; jadwalMedan["M"] = j.maghrib; jadwalMedan["I"] = j.isya;
                const [hSubuh, mSubuh] = j.subuh.split(':').map(Number);
                let totalMenitBesok = hSubuh * 60 + mSubuh + 1;
                jadwalMedan["S_Besok"] = `${String(Math.floor(totalMenitBesok / 60)).padStart(2,'0')}:${String(totalMenitBesok % 60).padStart(2,'0')}`;
            }
        }).catch(() => {});

        function verifikasiNIM() {
            const nim = document.getElementById('nimSiswa').value;
            const statusBox = document.getElementById('statusProfil');
            const passInput = document.getElementById('passSiswa');
            const btnSimpan = document.getElementById('btnSimpanPw');
            
            if(nim.length < 3) {
                document.getElementById('wadahAbsenSholat').style.display = "none";
                passInput.disabled = true; passInput.value = ""; btnSimpan.disabled = true;
                statusBox.className = "alert alert-secondary mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = "Silakan masukkan NIM terlebih dahulu.";
                return;
            }
            
            statusBox.innerHTML = "<i class='fa-solid fa-spinner fa-spin me-2'></i> Mencari NIM...";
            
            fetch(URL_WEB_APP, { method: "POST", body: JSON.stringify({ action: "cek_nim", nim: nim }) })
            .then(r => r.json()).then(res => {
                if(res.status === "ditemukan") {
                    profilSiswa = res;
                    passInput.disabled = false;
                    passInput.focus();
                    
                    if (!profilSiswa.password) {
                        statusBox.className = "alert alert-warning mb-0 p-2 d-flex align-items-center fw-bold small";
                        statusBox.innerHTML = "Akun Baru! Buat password baru lalu klik SIMPAN.";
                        btnSimpan.disabled = false;
                    } else {
                        statusBox.className = "alert alert-info mb-0 p-2 d-flex align-items-center fw-bold small";
                        statusBox.innerHTML = "NIM terverifikasi! Masukkan password kamu.";
                        btnSimpan.disabled = true; 
                    }
                } else {
                    profilSiswa = null;
                    document.getElementById('wadahAbsenSholat').style.display = "none";
                    passInput.disabled = true; passInput.value = ""; btnSimpan.disabled = true;
                    statusBox.className = "alert alert-danger mb-0 p-2 d-flex align-items-center fw-bold small";
                    statusBox.innerHTML = "NIM tidak terdaftar di Database!";
                }
            }).catch(() => {
                statusBox.className = "alert alert-danger mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = "Gagal terhubung ke database server!";
            });
        }

        function simpanPasswordBaru() {
            const passVal = document.getElementById('passSiswa').value.trim();
            const statusBox = document.getElementById('statusProfil');
            if(passVal.length < 4) { alert("Buat password minimal 4 karakter!"); return; }

            statusBox.innerHTML = "Menyimpan password...";
            fetch(URL_WEB_APP, {
                method: "POST",
                body: JSON.stringify({ action: "daftar_password", nim: profilSiswa.nim, password_baru: passVal })
            })
            .then(r => r.json()).then(res => {
                if(res.status === "sukses") {
                    profilSiswa.password = passVal;
                    document.getElementById('btnSimpanPw').disabled = true; 
                    cekPasswordKetik(); 
                } else {
                    alert("Gagal mendaftarkan password ke server.");
                    verifikasiNIM();
                }
            }).catch(() => {
                alert("Koneksi gagal saat mendaftarkan password.");
            });
        }

        function cekPasswordKetik() {
            const passVal = document.getElementById('passSiswa').value.trim();
            const statusBox = document.getElementById('statusProfil');
            
            if(!profilSiswa || !profilSiswa.password) return;

            if (String(passVal) === String(profilSiswa.password)) {
                let genderSiswaClean = String(profilSiswa.gender).toUpperCase().trim();
                let isLakiLaki = (genderSiswaClean === "L" || genderSiswaClean === "LAKI-LAKI");
                
                statusBox.className = "alert alert-success mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = `<i class='fa-solid fa-circle-check me-2'></i> AKSES TERBUKA: ${profilSiswa.nama} [${isLakiLaki ? 'Laki-laki':'Perempuan'}]`;
                
                generateBentukTombolSholat(isLakiLaki);
                document.getElementById('wadahAbsenSholat').style.display = "block";
            } else {
                statusBox.className = "alert alert-danger mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = "Password salah! Form terkunci.";
                document.getElementById('wadahAbsenSholat').style.display = "none";
            }
        }

        function generateBentukTombolSholat(isLakiLaki) {
            const wadah = document.getElementById('wadahAbsenSholat');
            wadah.innerHTML = "";

            const daftarSholat = [
                { kode: "S", nama: "SHUBUH", ikon: "fa-cloud-sun", duration: 90 },
                { kode: "Z", nama: "ZUHUR", ikon: "fa-sun", duration: 0 },
                { kode: "A", nama: "ASHAR", ikon: "fa-cloud-sun", duration: 0 },
                { kode: "M", nama: "MAGHRIB", ikon: "fa-cloud-moon", duration: 0 },
                { kode: "I", nama: "ISYA", ikon: "fa-moon", duration: 0 }
            ];

            daftarSholat.forEach(s => {
                const hMulai = _toMenit(jadwalMedan[s.kode]);
                let hAkhir = 0;

                if (s.kode === 'S') hAkhir = hMulai + s.duration;
                else if (s.kode === 'Z') hAkhir = _toMenit(jadwalMedan.A);
                else if (s.kode === 'A') hAkhir = _toMenit(jadwalMedan.M);
                else if (s.kode === 'M') hAkhir = _toMenit(jadwalMedan.I);
                else if (s.kode === 'I') hAkhir = _toMenit(jadwalMedan.S_Besok) + 1440 - 10; 

                const totalDurasi = hAkhir - hMulai;
                const sepertiga = Math.floor(totalDurasi / 3);

                const rangeAwal = `${jadwalMedan[s.kode]} - ${_toJamStr(hMulai + sepertiga)}`;
                const rangeTengah = `${_toJamStr(hMulai + sepertiga + 1)} - ${_toJamStr(hMulai + (sepertiga * 2))}`;
                const rangeAkhir = `${_toJamStr(hMulai + (sepertiga * 2) + 1)} - ${_toJamStr(hAkhir)}`;

                let tombolUtamaHTML = "";
                if(isLakiLaki) {
                    tombolUtamaHTML = `
                        <button id="btn-${s.kode}-BERJAMAAH" class="btn-opsi-sholat btn-biru" onclick="prosesKlaim('${s.kode}', 'BERJAMAAH', 20, 'biru')">
                            <i class="fa-solid fa-mosque mb-1 fs-5"></i>BERJAMAAH
                            <span class="text-sub-tombol">20 POINT</span>
                        </button>
                    `;
                } else {
                    tombolUtamaHTML = `
                        <button id="btn-${s.kode}-UDZUR" class="btn-opsi-sholat btn-abu" onclick="prosesUdzurPerempuan('${s.kode}')">
                            <i class="fa-solid fa-moon mb-1 fs-5"></i>UDZUR SYAR'I
                            <span class="text-sub-tombol">WARNA ABU</span>
                        </button>
                    `;
                }

                const barisHTML = `
                    <div class="sholat-row" id="baris-${s.kode}">
                        <div class="sholat-indeks text-uppercase">
                            <i class="fa-solid ${s.ikon} me-1"></i> ${s.nama}<br>
                            <span class="kotak-jam-masuk">${jadwalMedan[s.kode]}</span>
                        </div>
                        ${tombolUtamaHTML}
                        <button id="btn-${s.kode}-AWAL" class="btn-opsi-sholat btn-hijau" onclick="prosesKlaim('${s.kode}', 'AWAL', ${isLakiLaki ? 15 : 20}, 'hijau')">
                            AWAL WAKTU
                            <span>${rangeAwal}</span>
                            <span class="text-sub-tombol">${isLakiLaki ? 15 : 20} POINT</span>
                        </button>
                        <button id="btn-${s.kode}-TENGAH" class="btn-opsi-sholat btn-kuning" onclick="prosesKlaim('${s.kode}', 'TENGAH', 10, 'kuning')">
                            PERTENGAHAN WAKTU
                            <span>${rangeTengah}</span>
                            <span class="text-sub-tombol">10 POINT</span>
                        </button>
                        <button id="btn-${s.kode}-AKHIR" class="btn-opsi-sholat btn-merah" onclick="prosesKlaim('${s.kode}', 'AKHIR', 5, 'merah')">
                            AKHIR WAKTU
                            <span>${rangeAkhir}</span>
                            <span class="text-sub-tombol">5 POINT</span>
                        </button>
                    </div>
                `;
                wadah.innerHTML += barisHTML;
            });
        }

        function prosesUdzurPerempuan(kodeSholat) {
            const tanya = confirm("Sudahkah kamu bersholawat sebanyak 4 kali sebagai pengganti sholat fardhu?");
            if (tanya) {
                prosesKlaim(kodeSholat, 'UDZUR', 20, 'abu');
            } else {
                alert("Silakan bersholawat 4 kali terlebih dahulu sebelum melakukan klaim udzur ya nak.");
            }
        }

        function prosesKlaim(kodeSholat, jenisKlik, poinNilai, warnaKolom) {
            const baris = document.getElementById(`baris-${kodeSholat}`);
            const semuaTombolDiBaris = baris.querySelectorAll('button');
            semuaTombolDiBaris.forEach(btn => btn.disabled = true);

            const sekarang = new Date();
            const jamKlaim = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, ':');

            alert(`Sistem memproses rekap data...\nKategori: Sholat ${kodeSholat}\nKlaim Poin: ${poinNilai} Poin`);

            fetch(URL_WEB_APP, {
                method: 'POST',
                body: JSON.stringify({
                    action: "simpan_sholat",
                    nim: document.getElementById('nimSiswa').value,
                    sholat: kodeSholat,
                    jam: jamKlaim,
                    warna: warnaKolom,
                    poin: poinNilai
                })
            })
            .then(r => r.json()).then(res => {
                if(res.status === "sukses") {
                    alert("Sukses! Data laporan absensi sholat kamu telah berhasil terekam di database sistem.");
                } else {
                    alert("Gagal menyimpan data: " + res.pesan);
                    semuaTombolDiBaris.forEach(btn => btn.disabled = false);
                }
            })
            .catch(() => {
                alert("Error: Gagal terhubung ke server. Periksa jaringan Anda!");
                semuaTombolDiBaris.forEach(btn => btn.disabled = false);
            });
        }
    </script>
</body>
</html>
