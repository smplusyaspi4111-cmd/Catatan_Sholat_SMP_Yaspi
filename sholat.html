<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Laporan Sholat - SMP YASPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-sholat { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: white; margin-bottom: 20px; transition: transform 0.2s; }
        .card-sholat:hover { transform: translateY(-3px); }
        .btn-status { border-radius: 20px; font-weight: 600; font-size: 0.85rem; padding: 8px 15px; }
        .header-profile { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 0 0 25px 25px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<script>
    // LINK WEB APP DEPLOYMENT TERBARU BAPAK FUADY
    const API_URL = "https://script.google.com/macros/s/AKfycbxeM42GjGTdvJj9R0IG2dHtTIzT1e85BVWfUMmfVmJp2OdE9N_5Y5XdNGzzjTTk38xj/exec";

    // Jam Batas Toleransi Sholat Fardhu
    const masterJadwal = {
        "S": { nama: "Subuh", buka: "04:30", tutup: "06:00" },
        "Z": { nama: "Zuhur", buka: "12:00", tutup: "15:00" },
        "A": { nama: "Ashar", buka: "15:15", tutup: "18:00" },
        "M": { nama: "Maghrib", buka: "18:15", tutup: "19:15" },
        "I": { nama: "Isya", buka: "19:30", tutup: "23:59" }
    };

    let currentNIM = localStorage.getItem("login_nim") || "12345"; 
    let currentNama = localStorage.getItem("login_nama") || "Murid SMP YASPI";
    let currentJK = localStorage.getItem("login_jk") || "L"; 
</script>

<div class="container max-width-md px-3">
    <div class="header-profile mb-4 text-center">
        <i class="fa-solid fa-user-graduate fa-3x mb-2"></i>
        <h4 class="fw-bold mb-1" id="lblNama">Loading...</h4>
        <p class="mb-2 opacity-75" id="lblNIM">NIM: -</p>
        <span class="badge bg-light text-dark px-3 py-2 rounded-pill fw-bold" id="lblHariIni">Hari Ini</span>
    </div>

    <div id="areaUdzur" class="d-none mb-4">
        <button onclick="klaimUdzurSyari()" class="btn btn-secondary w-100 py-3 rounded-3 fw-bold shadow-sm">
            <i class="fa-solid fa-moon me-2"></i> Klik Disini Jika Sedang Halangan / Udzur Syar'i
        </button>
    </div>

    <div class="row" id="containerSholat">
        </div>
</div>

<div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 bg-transparent text-center text-white">
            <div class="spinner-border text-light mx-auto mb-2" style="width: 3rem; height: 3rem;" role="status"></div>
            <h6 class="fw-bold">Mengunci laporan ke server...</h6>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("lblNama").innerText = currentNama;
        document.getElementById("lblNIM").innerText = "NIM: " + currentNIM;
        
        // Tampilkan tombol udzur jika murid perempuan (P)
        if (currentJK.toUpperCase() === "P") {
            document.getElementById("areaUdzur").classList.remove("d-none");
        }

        // Set Label Tanggal Realtime Indonesia
        const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById("lblHariIni").innerText = new Date().toLocaleDateString('id-ID', opsi);

        renderCardSholat();
    });

    function renderCardSholat() {
        const container = document.getElementById("containerSholat");
        container.innerHTML = "";
        
        const d = new Date();
        const tglHariIni = d.getDate();

        Object.keys(masterJadwal).forEach(k => {
            const j = masterJadwal[k];
            const kuncian = localStorage.getItem(`kunci_${k}_${tglHariIni}`);
            
            let htmlCard = `
                <div class="col-12">
                    <div class="card card-sholat p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-clock text-primary me-2"></i>Sholat ${j.nama}</h5>
                            <span class="badge bg-dark opacity-50">${j.buka} - ${j.tutup}</span>
                        </div>
                        <div class="area-tombol mt-2 d-flex flex-wrap gap-2" id="box-${k}">
            `;

            if (kuncian) {
                const info = JSON.parse(kuncian);
                htmlCard += `
                    <div class="w-100 alert alert-success py-2 px-3 mb-0 rounded-3 d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-circle-check me-2"></i>Terlaporkan: <b>${info.status}</b></span>
                        <span class="badge bg-secondary">${info.jam} WIB</span>
                    </div>`;
            } else {
                if (currentJK.toUpperCase() === "L") {
                    htmlCard += `
                        <button onclick="prosesKlaim('${k}', 'BERJAMAAH', 'primary')" class="btn btn-primary btn-status flex-grow-1"><i class="fa-solid fa-users me-1"></i>Berjamaah (20)</button>
                        <button onclick="prosesKlaim('${k}', 'AWAL WAKTU', 'success')" class="btn btn-success btn-status flex-grow-1">Awal (15)</button>
                    `;
                } else {
                    // Murid Perempuan tidak ada tombol biru berjamaah, melainkan awal waktu langsung 20 poin
                    htmlCard += `
                        <button onclick="prosesKlaim('${k}', 'AWAL WAKTU', 'success')" class="btn btn-success btn-status flex-grow-1"><i class="fa-solid fa-star me-1"></i>Awal Waktu (20)</button>
                    `;
                }
                // Tombol Pertengahan dan Akhir Berlaku Universal
                htmlCard += `
                    <button onclick="prosesKlaim('${k}', 'PERTENGAHAN', 'warning')" class="btn btn-warning btn-status flex-grow-1 text-dark">Tengah (10)</button>
                    <button onclick="prosesKlaim('${k}', 'AKHIR WAKTU', 'danger')" class="btn btn-danger btn-status flex-grow-1">Akhir (5)</button>
                `;
            }

            htmlCard += `</div></div></div>`;
            container.innerHTML += htmlCard;
        });
    }

    function prosesKlaim(kodeSholat, tipeKlaim, payloadWarna) {
        const sekarang = new Date();
        const jamSekarangMenit = String(sekarang.getHours()).padStart(2, '0') + ":" + String(sekarang.getMinutes()).padStart(2, '0');
        const j = masterJadwal[kodeSholat];

        if (jamSekarangMenit < j.buka) {
            alert(`Belum masuk waktu untuk lapor sholat ${j.nama} nak..`);
            return;
        }
        if (jamSekarangMenit > j.tutup) {
            alert(`Waktu pelaporan sholat ${j.nama} hari ini sudah habis/ditutup nak..`);
            return;
        }

        if (!confirm(`Apakah kamu yakin melapor sholat ${tipeKlaim}? Data yang dikunci tidak bisa diubah!`)) return;

        var myModal = new bootstrap.Modal(document.getElementById('loadingModal'));
        myModal.show();

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ 
                action: "simpan_sholat", 
                nim: currentNIM, 
                sholat: kodeSholat, 
                jam: jamSekarangMenit,
                kategori: tipeKlaim 
            })
        })
        .then(res => res.json())
        .then(data => {
            myModal.hide();
            if(data.success) {
                kunciLokal(kodeSholat, tipeKlaim, jamSekarangMenit, payloadWarna);
            } else {
                alert("Gagal menyimpan ke server: " + data.message);
            }
        })
        .catch(err => {
            myModal.hide();
            kunciLokal(kodeSholat, tipeKlaim, jamSekarangMenit, payloadWarna);
        });
    }

    function klaimUdzurSyari() {
        if (!confirm("Apakah kamu yakin sedang halangan (Udzur Syar'i)? Seluruh 5 waktu sholat hari ini akan terisi otomatis dengan warna abu-abu.")) return;
        
        var myModal = new bootstrap.Modal(document.getElementById('loadingModal'));
        myModal.show();
        
        const sekarang = new Date();
        const jamSekarangMenit = String(sekarang.getHours()).padStart(2, '0') + ":" + String(sekarang.getMinutes()).padStart(2, '0');
        const listSholat = ["S", "Z", "A", "M", "I"];
        
        let promises = listSholat.map(k => {
            return fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "simpan_sholat", 
                    nim: currentNIM, 
                    sholat: k, 
                    jam: jamSekarangMenit, 
                    kategori: "UDZUR SYAR'I" 
                })
            }).then(res => res.json());
        });
        
        Promise.all(promises)
        .then(results => {
            myModal.hide();
            const tglHariIni = sekarang.getDate();
            listSholat.forEach(k => {
                localStorage.setItem(`kunci_${k}_${tglHariIni}`, JSON.stringify({ status: "UDZUR SYAR'I", jam: "UDZUR", warna: "secondary" }));
            });
            alert("Status Udzur Syar'i sukses disimpan di server!");
            renderCardSholat();
        })
        .catch(err => {
            myModal.hide();
            alert("Koneksi gagal saat mengirim data Udzur.");
        });
    }

    function kunciLokal(kodeSholat, tipeKlaim, jamKlik, warna) {
        const tglHariIni = new Date().getDate();
        localStorage.setItem(`kunci_${kodeSholat}_${tglHariIni}`, JSON.stringify({ status: tipeKlaim, jam: jamKlik, warna: warna }));
        renderCardSholat();
    }
</script>
</body>
</html>
