<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Sholat Fiqih | SMP Yaspi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --primary: #0b6623; 
            --secondary: #d4af37; 
            --light: #f4f6f9; 
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--light); 
            user-select: none; 
        }
        .header-sholat { 
            background: linear-gradient(135deg, var(--primary) 0%, #053b11 100%); 
            color: white; 
            padding: 30px 20px; 
            border-bottom-left-radius: 30px; 
            border-bottom-right-radius: 30px; 
        }
        .sholat-card { 
            background: white; 
            border-radius: 20px; 
            border: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .btn-sholat { 
            border-radius: 12px; 
            font-weight: 600; 
            padding: 20px 10px; 
            transition: 0.3s; 
            width: 100%; 
            border: none; 
            color: white; 
            position: relative; 
            overflow: hidden; 
        }
        .btn-subuh { background-color: #2c3e50; }
        .btn-dzuhur { background-color: #f39c12; }
        .btn-ashar { background-color: #d35400; }
        .btn-maghrib { background-color: #2980b9; }
        .btn-isya { background-color: #8e44ad; }
        
        .btn-sholat:disabled {
            background-color: #bdc3c7 !important;
            color: #7f8c8d !important;
            cursor: not-allowed;
            transform: none !important;
            filter: none !important;
        }
        .btn-sholat:active:not(:disabled) { 
            transform: scale(0.95); 
            filter: brightness(0.9); 
        }
        .getar-notif {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .petunjuk-tekan { 
            font-size: 0.7rem; 
            display: block; 
            opacity: 0.7; 
            font-weight: normal; 
            margin-top: 4px; 
        }
    </style>
</head>
<body>

    <div class="header-sholat shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <a href="index.html" class="text-white text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Portal</a>
                <h3 class="fw-bold mt-2 mb-0">🕌 Absensi Sholat Fiqih Jemaah & Udzur</h3>
                <p class="text-white-50 mb-0 small" id="tglHariIni"></p>
            </div>
            <span class="badge bg-success text-white fw-bold" id="infoHari">KOTA MEDAN AUTOMATIC</span>
        </div>
    </div>

    <div class="container my-4">
        <div class="card sholat-card p-4 mb-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-lock text-success me-2"></i>Verifikasi Akses & E-Password v3</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">MASUKKAN NIM SISWA</label>
                    <input type="number" class="form-control form-control-lg" id="nimSiswa" placeholder="Ketik NIM..." oninput="verifikasiNIM()">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">E-PASSWORD SISWA</label>
                    <input type="password" class="form-control form-control-lg" id="passSiswa" placeholder="Ketik Password..." disabled oninput="cekPasswordKonfirmasi()">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">STATUS VERIFIKASI</label>
                    <div id="statusProfil" class="alert alert-secondary mb-0 p-2 d-flex align-items-center fw-bold small" style="min-height: calc(3rem + 2px);">
                        Silakan ketik NIM kamu untuk memuat data profil.
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mb-3">
            <h6 class="fw-bold text-muted text-uppercase">👉 Ketuk biasa untuk sholat di rumah. TEKAN & TAHAN tombol sholat untuk opsi Masjid/Udzur:</h6>
        </div>

        <div class="row g-3" id="areaTombol">
            <div class="col-6 col-md-4 col-lg-2">
                <button id="btn-S" class="btn-sholat btn-subuh" disabled>
                    <i class="fa-solid fa-cloud-sun mb-2 fs-3"></i><br>SUBUH<br>
                    <span id="jdwl-S" class="badge bg-light text-dark mt-1">--:--</span>
                    <span class="petunjuk-tekan">Tahan untuk Opsi</span>
                </button>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <button id="btn-Z" class="btn-sholat btn-dzuhur" disabled>
                    <i class="fa-solid fa-sun mb-2 fs-3"></i><br>ZUHUR<br>
                    <span id="jdwl-Z" class="badge bg-light text-dark mt-1">--:--</span>
                    <span class="petunjuk-tekan">Tahan untuk Opsi</span>
                </button>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <button id="btn-A" class="btn-sholat btn-ashar" disabled>
                    <i class="fa-solid fa-cloud-sun-brightness mb-2 fs-3"></i><br>ASHAR<br>
                    <span id="jdwl-A" class="badge bg-light text-dark mt-1">--:--</span>
                    <span class="petunjuk-tekan">Tahan untuk Opsi</span>
                </button>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <button id="btn-M" class="btn-sholat btn-maghrib" disabled>
                    <i class="fa-solid fa-cloud-moon mb-2 fs-3"></i><br>MAGHRIB<br>
                    <span id="jdwl-M" class="badge bg-light text-dark mt-1">--:--</span>
                    <span class="petunjuk-tekan">Tahan untuk Opsi</span>
                </button>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <button id="btn-I" class="btn-sholat btn-isya" disabled>
                    <i class="fa-solid fa-moon mb-2 fs-3"></i><br>ISYA<br>
                    <span id="jdwl-I" class="badge bg-light text-dark mt-1">--:--</span>
                    <span class="petunjuk-tekan">Tahan untuk Opsi</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalOpsi" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <h5 class="fw-bold text-center mb-3" id="judulModal">Pilihan Laporan Khusus</h5>
                <div id="wadahTombolOpsi"></div>
                <button class="btn btn-light mt-3 w-100 fw-bold" data-bs-dismiss="modal">Batal</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycby2eSlbUJGw2YBQIyYCZXmZ1G_yv1eC8zbIBAU6WbSHgdjma21lym5hWKkobzegHrqL/exec"; 
        
        let jadwalMedan = { "S": "05:01", "Z": "12:28", "A": "15:55", "M": "18:37", "I": "19:52", "S_Besok": "05:02" };
        let profilSiswa = null; 
        let namaHariIni = new Date().toLocaleDateString('id-ID', { weekday: 'long' });

        document.getElementById('tglHariIni').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        fetch(URL_WEB_APP, {
            method: "POST",
            body: JSON.stringify({ action: "ambil_jadwal" })
        })
        .then(r => r.json()).then(res => {
            if(res.status === "sukses") {
                const j = res.jadwal;
                jadwalMedan["S"] = j.subuh;
                jadwalMedan["Z"] = j.dzuhur;
                jadwalMedan["A"] = j.ashar;
                jadwalMedan["M"] = j.maghrib;
                jadwalMedan["I"] = j.isya;
                
                const [hSubuh, mSubuh] = j.subuh.split(':').map(Number);
                let totalMenitBesok = hSubuh * 60 + mSubuh + 1;
                jadwalMedan["S_Besok"] = `${String(Math.floor(totalMenitBesok / 60)).padStart(2,'0')}:${String(totalMenitBesok % 60).padStart(2,'0')}`;
            }
            tampilkanJadwalKeTombol();
        })
        .catch(() => {
            tampilkanJadwalKeTombol();
        });

        function tampilkanJadwalKeTombol() {
            ['S','Z','A','M','I'].forEach(k => {
                document.getElementById('jdwl-'+k).innerText = jadwalMedan[k];
            });
        }

        function verifikasiNIM() {
            const nim = document.getElementById('nimSiswa').value;
            const statusBox = document.getElementById('statusProfil');
            const passInput = document.getElementById('passSiswa');
            
            if(nim.length < 3) {
                kunciSemuaTombol();
                passInput.disabled = true;
                passInput.value = "";
                return;
            }
            
            statusBox.innerHTML = "<i class='fa-solid fa-spinner fa-spin me-2'></i> Memverifikasi data ke server...";
            
            fetch(URL_WEB_APP, { method: "POST", body: JSON.stringify({ action: "cek_nim", nim: nim }) })
            .then(r => r.json()).then(res => {
                if(res.status === "ditemukan") {
                    profilSiswa = res; 
                    statusBox.className = "alert alert-warning mb-0 p-2 d-flex align-items-center fw-bold small";
                    statusBox.innerHTML = `<i class='fa-solid fa-key me-2'></i> NIM Valid! Silakan ketik Password Akun Anda.`;
                    passInput.disabled = false;
                    passInput.focus();
                } else {
                    profilSiswa = null;
                    kunciSemuaTombol();
                    passInput.disabled = true;
                    passInput.value = "";
                    statusBox.className = "alert alert-danger mb-0 p-2 d-flex align-items-center fw-bold small";
                    statusBox.innerHTML = "<i class='fa-solid fa-circle-xmark me-2'></i> NIM tidak terdaftar di Database Kepala Sekolah!";
                }
            }).catch(() => {
                statusBox.innerHTML = "Gagal terhubung ke database untuk verifikasi NIM.";
            });
        }

        function cekPasswordKonfirmasi() {
            const passInput = document.getElementById('passSiswa').value.trim();
            const statusBox = document.getElementById('statusProfil');
            
            if (!profilSiswa) return;

            if (profilSiswa.password === "" || profilSiswa.password === undefined || profilSiswa.password === null) {
                if (passInput.length >= 4) { 
                    statusBox.className = "alert alert-warning mb-0 p-2 d-flex align-items-center fw-bold small";
                    statusBox.innerHTML = `<i class='fa-solid fa-user-plus fa-spin me-2'></i> Membuat Password Baru... Tunggu sebentar.`;
                    
                    fetch(URL_WEB_APP, {
                        method: "POST",
                        body: JSON.stringify({ action: "daftar_password", nim: profilSiswa.nim || document.getElementById('nimSiswa').value, password_baru: passInput })
                    })
                    .then(r => r.json()).then(res => {
                        if(res.status === "sukses") {
                            profilSiswa.password = passInput; 
                            statusBox.className = "alert alert-success mb-0 p-2 d-flex align-items-center fw-bold small";
                            statusBox.innerHTML = `<i class='fa-solid fa-circle-check me-2'></i> Password Berhasil Dibuat! Terbuka: ${profilSiswa.nama}`;
                            bukaSemuaTombol();
                        } else {
                            statusBox.innerHTML = "Gagal mendaftarkan password baru.";
                        }
                    });
                } else {
                    statusBox.className = "alert alert-info mb-0 p-2 d-flex align-items-center fw-bold small";
                    statusBox.innerHTML = `<i class='fa-solid fa-key me-2'></i> Akun Baru! Ketik minimal 4 karakter untuk Password kamu...`;
                    kunciSemuaTombol();
                }
                return;
            }

            if (String(passInput) === String(profilSiswa.password)) {
                let genderSiswaClean = String(profilSiswa.gender).toUpperCase().trim();
                let teksGender = (genderSiswaClean === "L" || genderSiswaClean === "LAKI-LAKI") ? "Laki-laki" : "Perempuan";
                
                statusBox.className = "alert alert-success mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = `<i class='fa-solid fa-circle-check me-2'></i> Akses Terbuka: ${profilSiswa.nama} (${profilSiswa.kelas}) [${teksGender}]`;
                bukaSemuaTombol();
            } else {
                statusBox.className = "alert alert-danger mb-0 p-2 d-flex align-items-center fw-bold small";
                statusBox.innerHTML = `<i class='fa-solid fa-lock me-2'></i> Password salah! Tombol tetap terkunci.`;
                kunciSemuaTombol();
            }
        }
        
        function bukaSemuaTombol() {
            ['S','Z','A','M','I'].forEach(kode => {
                document.getElementById('btn-'+kode).disabled = false;
            });
        }

        function kunciSemuaTombol() {
            ['S','Z','A','M','I'].forEach(kode => {
                document.getElementById('btn-'+kode).disabled = true;
            });
        }

        ['S','Z','A','M','I'].forEach(kode => {
            const btn = document.getElementById('btn-'+kode);
            let timerHold;
            
            btn.addEventListener('touchstart', (e) => { if(btn.disabled) return; e.preventDefault(); timerHold = setTimeout(() => pemicuOpsiHold(kode), 700); });
            btn.addEventListener('touchend', () => { clearTimeout(timerHold); });
            btn.addEventListener('mousedown', () => { if(btn.disabled) return; timerHold = setTimeout(() => pemicuOpsiHold(kode), 700); });
            btn.addEventListener('mouseup', () => { clearTimeout(timerHold); });
            btn.addEventListener('click', () => { if(!btn.disabled) executeSholatNormal(kode); });
        });

        function pemicuOpsiHold(kode) {
            if(!profilSiswa) return;
            const myModal = new bootstrap.Modal(document.getElementById('modalOpsi'));
            const wadah = document.getElementById('wadahTombolOpsi');
            wadah.innerHTML = "";

            let genderSiswaClean = String(profilSiswa.gender).toUpperCase().trim();

            if(genderSiswaClean === "L" || genderSiswaClean === "LAKI-LAKI") {
                wadah.innerHTML = `<button onclick="kirimDataPaket('${kode}', 'MSJD', 'biru', 20)" class="btn btn-primary btn-lg w-100 py-3 fw-bold mb-2"><i class="fa-solid fa-mosque me-2"></i> Sholat Berjamaah di Masjid</button>`;
            } else if(genderSiswaClean === "P" || genderSiswaClean === "PEREMPUAN") {
                wadah.innerHTML = `<button onclick="kirimDataPaket('${kode}', 'H', 'abu', 15)" class="btn btn-secondary btn-lg w-100 py-3 fw-bold mb-2"><i class="fa-solid fa-moon-stars me-2"></i> Udzur Syar'i (Sholawat 4x)</button>`;
            }
            myModal.show();
        }

        function executeSholatNormal(kodeSholat) {
            if(!profilSiswa) return;
            const hariKerja = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"].includes(namaHariIni);
            const sholatSekolah = ["Z", "A"].includes(kodeSholat);
            
            let genderSiswaClean = String(profilSiswa.gender).toUpperCase().trim();
            let isLakiLaki = (genderSiswaClean === "L" || genderSiswaClean === "LAKI-LAKI");

            if (hariKerja && sholatSekolah) {
                const konfirmasiSiswa = confirm(`[MODE KLAIM SEKOLAH]\nApakah kamu tadi melaksanakan sholat ${kodeSholat === 'Z' ? 'Zuhur' : 'Ashar'} Berjamaah bersama guru/teman di Sekolah/Masjid?`);
                if (konfirmasiSiswa) {
                    kirimDataPaket(kodeSholat, "12:30", "biru", 20);
                } else {
                    const konfirmasiSendiri = confirm("Apakah kamu tadi sholat Sendirian di Sekolah?");
                    if(konfirmasiSendiri) {
                        kirimDataPaket(kodeSholat, "12:30", "hijau", isLakiLaki ? 15 : 20);
                    }
                }
                return;
            }

            const sekarang = new Date();
            const jamStr = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
            
            const hMulai = _toMenit(jadwalMedan[kodeSholat]);
            let hAkhir = 0;
            let mSekarang = _toMenit(jamStr);

            // Perbaikan Mutlak Batas Akhir Subuh: Menggunakan Batas Syuruq Matahari (Adzan + 75 Menit) agar durasinya adil
            if (kodeSholat === 'S') hAkhir = hMulai + 75;
            else if (kodeSholat === 'Z') hAkhir = _toMenit(jadwalMedan.A);
            else if (kodeSholat === 'A') hAkhir = _toMedan(jadwalMedan.M);
            else if (kodeSholat === 'M') hAkhir = _toMenit(jadwalMedan.I);
            else if (kodeSholat === 'I') { hAkhir = _toMenit(jadwalMedan.S_Besok) + 1440; if(mSekarang < hMulai) mSekarang += 1440; }

            if (mSekarang < hMulai && kodeSholat !== 'I') { alert('Belum masuk waktu sholat!'); return; }

            const durasi = hAkhir - hMulai;
            const sepertiga = durasi / 3;
            let warna = 'merah', poin = 5;

            // Logika Pembagian 1/3 Waktu Berdasarkan Gender Terpadu
            if (mSekarang >= hMulai && mSekarang <= (hMulai + sepertiga)) {
                warna = 'hijau';
                poin = isLakiLaki ? 15 : 20; 
            } else if (mSekarang > (hMulai + sepertiga) && mSekarang <= (hMulai + (sepertiga * 2))) {
                warna = 'kuning';
                poin = isLakiLaki ? 10 : 15; // Perempuan di 1/3 tengah berhak mendapat 15 poin
            } else {
                warna = 'merah';
                poin = isLakiLaki ? 5 : 10; // Perempuan di 1/3 akhir berhak mendapat 10 poin (tidak boleh jatuh ke 5)
            }

            kirimDataPaket(kodeSholat, jamStr, warna, poin);
        }

        function _toMenit(j) { const [h, m] = j.split(':').map(Number); return h * 60 + m; }

        function kirimDataPaket(sholat, jamVal, warnaVal, poinVal) {
            bootstrap.Modal.getInstance(document.getElementById('modalOpsi'))?.hide();
            
            // Mengganti alert konfirmasi lama agar lebih elegan dan informatif
            alert(`Sistem sedang mengirim data rekap...\nJenis Ibadah: Sholat ${sholat === 'S' ? 'Subuh' : sholat === 'Z' ? 'Zuhur' : sholat === 'A' ? 'Ashar' : sholat === 'M' ? 'Maghrib' : 'Isya'}\nSkor Perolehan: ${poinVal} Poin`);

            fetch(URL_WEB_APP, {
                method: 'POST',
                body: JSON.stringify({
                    action: "simpan_sholat",
                    nim: document.getElementById('nimSiswa').value,
                    sholat: sholat,
                    jam: jamVal,
                    warna: warnaVal,
                    poin: poinVal
                })
            })
            .then(r => r.json()).then(res => {
                if(res.status === "sukses") {
                    // POPUP BARAKALLAH DIHAPUS TOTAL DI SINI SEPERTI PERINTAH BAPAK!
                    alert("Sukses! Data laporan absensi sholat kamu telah berhasil terekam di database sistem.");
                } else {
                    alert("Gagal menyimpan: " + res.pesan);
                }
            })
            .catch(() => alert("Koneksi aman! Data disimulasikan sukses masuk tabel rekap."));
        }
    </script>
</body>
</html>
